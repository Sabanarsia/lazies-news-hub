<!DOCTYPE html>
<html lang="ka" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ზარმაცების ნიუსჰაბი - Lazies NewsHub</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        cardBg: '#1e293b'
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=Noto+Sans+Georgian:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans Georgian', 'Fira Code', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-darkBg text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-300">

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-white/80 dark:bg-cardBg/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-700 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 text-white p-2 rounded-xl shadow-lg">
                    <i data-lucide="newspaper" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 id="site-title" class="text-xl font-bold tracking-tight">ზარმაცების ნიუსჰაბი</h1>
                    <p id="site-subtitle" class="text-xs text-slate-500 dark:text-slate-400">ყველა მნიშვნელოვანი ამბავი ერთ სივრცეში</p>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="w-full md:w-96 relative">
                <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                <input type="text" id="search-input" placeholder="ძებნა სათაურებში..." 
                    class="w-full pl-9 pr-4 py-2 bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
            </div>

            <!-- Controls (Lang & Theme & Refresh) -->
            <div class="flex items-center gap-3">
                <button id="lang-btn" class="px-3 py-1.5 text-xs font-medium bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 rounded-lg transition-colors">EN</button>
                <button id="refresh-btn" class="p-2 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 rounded-lg transition-colors" title="განახლება">
                    <i data-lucide="rotate-cw" class="w-4 h-4"></i>
                </button>
                <button id="theme-btn" class="p-2 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 rounded-lg transition-colors" title="თემა">
                    <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
                    <i data-lucide="moon" class="w-4 h-4 block dark:hidden"></i>
                </button>
            </div>
        </div>

        <!-- Categories & Sources Nav -->
        <div class="max-w-7xl mx-auto px-4 py-2 border-t border-slate-100 dark:border-slate-800 flex flex-col gap-2">
            <div id="category-tabs" class="flex items-center gap-2 overflow-x-auto pb-1 text-sm">
                <!-- Dynamically filled -->
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        <!-- Status / Errors -->
        <div id="error-banner" class="hidden mb-6 p-4 bg-amber-500/10 border border-amber-500/20 text-amber-600 dark:text-amber-400 text-sm rounded-xl"></div>

        <!-- News Grid -->
        <div id="news-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Skeletons loading -->
            <div class="bg-white dark:bg-cardBg rounded-2xl p-4 border border-slate-200 dark:border-slate-700 animate-pulse">
                <div class="h-48 bg-slate-200 dark:bg-slate-800 rounded-xl mb-4"></div>
                <div class="h-4 bg-slate-200 dark:bg-slate-800 rounded w-3/4 mb-2"></div>
                <div class="h-4 bg-slate-200 dark:bg-slate-800 rounded w-1/2"></div>
            </div>
            <div class="bg-white dark:bg-cardBg rounded-2xl p-4 border border-slate-200 dark:border-slate-700 animate-pulse">
                <div class="h-48 bg-slate-200 dark:bg-slate-800 rounded-xl mb-4"></div>
                <div class="h-4 bg-slate-200 dark:bg-slate-800 rounded w-3/4 mb-2"></div>
                <div class="h-4 bg-slate-200 dark:bg-slate-800 rounded w-1/2"></div>
            </div>
            <div class="bg-white dark:bg-cardBg rounded-2xl p-4 border border-slate-200 dark:border-slate-700 animate-pulse">
                <div class="h-48 bg-slate-200 dark:bg-slate-800 rounded-xl mb-4"></div>
                <div class="h-4 bg-slate-200 dark:bg-slate-800 rounded w-3/4 mb-2"></div>
                <div class="h-4 bg-slate-200 dark:bg-slate-800 rounded w-1/2"></div>
            </div>
        </div>
    </main>

    <!-- JavaScript Application Logic -->
    <script>
        // SOURCES - 100% სტაბილური Google News და პირდაპირი RSS არხები
        const SOURCES = [
            // ⚔️ სამხედრო / კონფლიქტები
            { name: "ISW (War Studies)", url: "https://understandingwar.org/rss.xml", category: "military", lang: "en" },
            { name: "The War Zone (TWZ)", url: "https://twz.com/feed", category: "military", lang: "en" },
            { name: "The Guardian", url: "https://www.theguardian.com/world/rss", category: "military", lang: "en" },
            { name: "Civil.ge (Military)", url: "https://civil.ge/ka/feed", category: "military", lang: "ka" },

            // 🏛️ პოლიტიკა / ტელეარხები / ზოგადი
            { name: "IPN", url: "https://news.google.com/rss/search?q=site:interpressnews.ge", category: "politics", lang: "ka" },
            { name: "ტვ პირველი", url: "https://news.google.com/rss/search?q=site:tvpirveli.ge", category: "politics", lang: "ka" },
            { name: "მთავარი არხი", url: "https://news.google.com/rss/search?q=site:mtavari.tv", category: "politics", lang: "ka" },
            { name: "იმედი", url: "https://news.google.com/rss/search?q=site:imedinews.ge", category: "politics", lang: "ka" },
            { name: "ფორმულა", url: "https://news.google.com/rss/search?q=site:formulanews.ge", category: "politics", lang: "ka" },
            { name: "რადიო თავისუფლება", url: "https://www.radiotavisupleba.ge/api/z--qqpieqv", category: "politics", lang: "ka" },
            { name: "BBC World", url: "http://feeds.bbci.co.uk/news/world/rss.xml", category: "politics", lang: "en" },

            // ⚽ სპორტი
            { name: "აჭარასპორტი", url: "https://news.google.com/rss/search?q=site:adjarasport.com", category: "sports", lang: "ka" },
            { name: "Crystalsport", url: "https://news.google.com/rss/search?q=site:crystalsport.ge", category: "sports", lang: "ka" },
            { name: "Lelo.ge", url: "https://lelo.ge/feed/", category: "sports", lang: "ka" },
            { name: "BBC Sport", url: "http://feeds.bbci.co.uk/sport/rss.xml", category: "sports", lang: "en" },

            // 💻 ტექნოლოგიები
            { name: "Marketer.ge", url: "https://www.marketer.ge/feed/", category: "tech", lang: "ka" },
            { name: "Dev.ge", url: "https://dev.ge/feed", category: "tech", lang: "ka" },
            { name: "The Verge", url: "https://www.theverge.com/rss/index.xml", category: "tech", lang: "en" },
            { name: "TechCrunch", url: "https://techcrunch.com/feed/", category: "tech", lang: "en" }
        ];

        const CATEGories = {
            ka: { all: 'ყველა', military: 'სამხედრო / კონფლიქტები', politics: 'პოლიტიკა', sports: 'სპორტი', tech: 'ტექნოლოგიები' },
            en: { all: 'All', military: 'Military / Conflicts', politics: 'Politics', sports: 'Sports', tech: 'Tech' }
        };

        let currentLang = localStorage.getItem('news_lang') || 'ka';
        let currentCategory = 'all';
        let searchQuery = '';
        let allArticles = [];
        let failedSources = [];

        // DOM Elements
        const newsGrid = document.getElementById('news-grid');
        const searchInput = document.getElementById('search-input');
        const langBtn = document.getElementById('lang-btn');
        const themeBtn = document.getElementById('theme-btn');
        const refreshBtn = document.getElementById('refresh-btn');
        const categoryTabs = document.getElementById('category-tabs');
        const errorBanner = document.getElementById('error-banner');
        const siteTitle = document.getElementById('site-title');
        const siteSubtitle = document.getElementById('site-subtitle');

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            renderUI();
            fetchNews();
            
            langBtn.addEventListener('click', toggleLang);
            themeBtn.addEventListener('click', toggleTheme);
            refreshBtn.addEventListener('click', fetchNews);
            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value.toLowerCase();
                renderNews();
            });
        });

        function initTheme() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        function toggleTheme() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
            }
        }

        function toggleLang() {
            currentLang = currentLang === 'ka' ? 'en';
            localStorage.setItem('news_lang', currentLang);
            renderUI();
            fetchNews();
        }

        function renderUI() {
            langBtn.textContent = currentLang === 'ka' ? 'EN' : 'ქარ';
            siteTitle.textContent = currentLang === 'ka' ? 'ზარმაცების ნიუსჰაბი' : 'Lazies NewsHub';
            siteSubtitle.textContent = currentLang === 'ka' ? 'ყველა მნიშვნელოვანი ამბავი ერთ სივრცეში' : 'All important news in one place';
            searchInput.placeholder = currentLang === 'ka' ? 'ძებნა სათაურებში...' : 'Search headlines...';

            // Render Category Tabs
            const cats = CATEGories[currentLang];
            categoryTabs.innerHTML = Object.entries(cats).map(([key, name]) => `
                <button onclick="setCategory('${key}')" class="px-4 py-1.5 rounded-xl font-medium text-xs whitespace-nowrap transition-all ${currentCategory === key ? 'bg-indigo-600 text-white shadow-md shadow-indigo-500/20' : 'bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700'}">
                    ${name}
                </button>
            `).join('');

            lucide.createIcons();
        }

        window.setCategory = function(cat) {
            currentCategory = cat;
            renderUI();
            renderNews();
        }

        async function fetchNews() {
            newsGrid.innerHTML = `
                <div class="col-span-full flex flex-col items-center justify-center py-16 text-slate-400">
                    <i data-lucide="loader-2" class="w-8 h-8 animate-spin mb-2 text-indigo-600"><span>იტვირთება სიახლეები...</span></i>
                </div>
            `;
            lucide.createIcons();
            errorBanner.classList.add('hidden');
            allArticles = [];
            failedSources = [];

            // Filter sources by active language (ka or en)
            const activeSources = SOURCES.filter(s => s.lang === currentLang);

            await Promise.all(activeSources.map(async (source) => {
                try {
                    const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(source.url)}`;
                    const res = await fetch(apiUrl);
                    const data = await res.json();
                    
                    if (data.status === 'ok' && data.items) {
                        data.items.forEach(item => {
                            allArticles.push({
                                title: item.title,
                                link: item.link,
                                pubDate: new Date(item.pubDate),
                                sourceName: source.name,
                                category: source.category,
                                thumbnail: item.thumbnail || item.enclosure?.link || extractImage(item.description) || null
                            });
                        });
                    } else {
                        failedSources.push(source.name);
                    }
                } catch (err) {
                    failedSources.push(source.name);
                }
            }));

            // Sort by date descending
            allArticles.sort((a, b) => b.pubDate - a.pubDate);

            if (failedSources.length > 0) {
                errorBanner.textContent = (currentLang === 'ka' ? 'ვერ ჩაიტვირთა: ' : 'Failed to load: ') + failedSources.join(', ');
                errorBanner.classList.remove('hidden');
            }

            renderNews();
        }

        function extractImage(htmlContent) {
            if (!htmlContent) return null;
            const match = htmlContent.match(/<img[^>]+src="([^">]+)"/);
            return match ? match[1] : null;
        }

        function renderNews() {
            let filtered = allArticles;

            if (currentCategory !== 'all') {
                filtered = filtered.filter(a => a.category === currentCategory);
            }

            if (searchQuery) {
                filtered = filtered.filter(a => a.title.toLowerCase().includes(searchQuery));
            }

            if (filtered.length === 0) {
                newsGrid.innerHTML = `
                    <div class="col-span-full text-center py-16 text-slate-400">
                        <i data-lucide="frown" class="w-12 h-12 mx-auto mb-2 opacity-50"></i>
                        <p>${currentLang === 'ka' ? 'სიახლე ვერ მოიძებნა.' : 'No news found.'}</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            newsGrid.innerHTML = filtered.map(art => `
                <article class="bg-white dark:bg-cardBg rounded-2xl overflow-hidden border border-slate-200 dark:border-slate-700/60 shadow-sm hover:shadow-md transition-all flex flex-col justify-between">
                    <div>
                        ${art.thumbnail ? `<div class="h-48 overflow-hidden bg-slate-100 dark:bg-slate-900"><img src="${art.thumbnail}" alt="" class="w-full h-full object-cover hover:scale-105 transition-transform duration-500" loading="lazy"></div>` : ''}
                        <div class="p-5">
                            <div class="flex items-center justify-between gap-2 mb-3">
                                <span class="px-2.5 py-1 text-xs font-semibold bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 dark:text-indigo-400 rounded-lg">${art.sourceName}</span>
                                <span class="text-xs text-slate-400">${timeAgo(art.pubDate)}</span>
                            </div>
                            <h2 class="font-bold text-base leading-snug mb-3 line-clamp-3 hover:text-indigo-600 transition-colors">
                                <a href="${art.link}" target="_blank" rel="noopener noreferrer">${art.title}</a>
                            </h2>
                        </div>
                    </div>
                    <div class="p-5 pt-0">
                        <a href="${art.link}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 text-xs font-semibold text-indigo-600 dark:text-indigo-400 hover:underline">
                            ${currentLang === 'ka' ? 'სრულად წაკითხვა' : 'Read full'} <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                        </a>
                    </div>
                </article>
            `).join('');

            lucide.createIcons();
        }

        function timeAgo(date) {
            const seconds = Math.floor((new Date() - date) / 1000);
            const intervals = {
                year: 31536000, month: 2592000, week: 604800, day: 86400, hour: 3600, minute: 60
            };
            if (currentLang === 'ka') {
                if (seconds < 60) return 'ახლახანს';
                if (seconds < 3600) return Math.floor(seconds / 60) წუთის წინ;
                if (seconds < 86400) return Math.floor(seconds / 3600) საათის წინ;
                return Math.floor(seconds / 86400) დღის წინ;
            } else {
                if (seconds < 60) return 'Just now';
                if (seconds < 3600) return Math.floor(seconds / 60) + 'm ago';
                if (seconds < 86400) return Math.floor(seconds / 3600) + 'h ago';
                return Math.floor(seconds / 86400) + 'd ago';
            }
        }
    </script>
</body>
</html>
